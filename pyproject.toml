[project]
name = "igipy"
version = "1.0.0"
description = "Reverse engineering tools for 'Project IGI' game"
readme = "README.md"
authors = [
    { name = "artiom.rotari", email = "artiom.rotari@ebs-integrator.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "typer>=0.16.0",
]

[project.scripts]
igipy = "igipy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "polars>=1.41.2",
    "ruff>=0.15.15",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 120
lint.select = ["ALL"]
lint.ignore = [
    "D",
    "COM812",
    "EM101",
    "EM102",
    "TRY003",
    "FBT001",
    "FBT002"
]
